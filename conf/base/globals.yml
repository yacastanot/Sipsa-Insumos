# =============================================================================
# SIPSA INSUMOS — Variables globales del período (Kedro OmegaConfLoader)
# Referenciadas en catalog_*.yml con ${globals:<clave>}
# Actualizar al inicio de cada período mensual.
# =============================================================================

periodo: "SEP2026"                      # ID del período: MMMAAAA (mayúsculas)
periodo_anterior: "AGO2026"             # ID período anterior (mensual)
periodo_anterior_bimestral: "JUL2026"   # ID período anterior bimestral (Elementos, Empaques: ENE,MAR,MAY,JUL... | Propagacion: FEB,ABR,JUN,AGO... — AGO usa la de Propagacion, único bimestral activo este mes)
periodo_anterior_trimestral: "JUN2026"  # ID período anterior trimestral (Arriendos,Servicios: FEB,MAY,AGO,NOV | Jornales,Especies: MAR,JUN,SEP,DIC) — AGO usa la de Arriendos/Servicios
mes_actual: "Septiembre"                    # Nombre mes actual en español
mes_anterior: "Agosto"                   # Nombre mes anterior en español
mes_num_actual: 9                       # Número del mes actual (sin cero)
mes_num_anterior: 8                     # Número del mes anterior
anio: 2026                              # Año del período
