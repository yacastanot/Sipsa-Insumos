# =============================================================================
# SIPSA INSUMOS — Parámetros globales del período
# Actualizar junto con globals.yml al inicio de cada período mensual.
# =============================================================================

periodo: "JUL2026"
periodo_anterior: "JUN2026"
mes_actual: "Julio"
mes_anterior: "Junio"
mes_num_actual: 7
mes_num_anterior: 6
mes_num_menos2: 5       # Número mes t-2
mes_num_menos3: 4       # Número mes t-3
anio: 2026
fecha_proceso: "20260729"   # YYYYMMDD para nombres de archivo de salida

# Rutas de salida
ruta_reporting: "data/08_reporting/${globals:periodo}"

# Archivo DIVIPOLA compartido (municipios y departamentos)
archivo_divipola: "data/01_raw/DIVIPOLA.xlsx"
hoja_divipola: "Dep_Mun"

# Umbrales de control de calidad (comunes a todos los módulos)
umbral_var_alta: 25.0       # VAR >= umbral → REVISA=1
umbral_var_baja: -25.0      # VAR <= umbral → REVISA=1
umbral_var_extrema: 100.0   # VAR >= umbral → REVISA=3
umbral_cv: 30.0             # CV > umbral → alerta en informe
