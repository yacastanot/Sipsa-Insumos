#   Elementos   — bimestral impar (ENE, MAR, MAY, JUL, SEP, NOV)
#   Propagación — bimestral par   (FEB, ABR, JUN, AGO, OCT, DIC)
#
# Este módulo corre DESPUÉS del procesamiento principal de cada uno (agricolas,
# pecuarios, etc.), porque ruta_var_atipico apunta al VAR_ATIPICO_*.xlsx que
# el propio pipeline genera en el paso reporting (data/08_reporting/{periodo}/
# {modulo}/) — no es un archivo externo revisado por un analista.
#
# ruta_historico SÍ es un insumo externo: el Excel "para revisiones" que se
# coloca en data/01_raw/{periodo}/SIN_PRECIO_ANT {periodo}/.
# =============================================================================

