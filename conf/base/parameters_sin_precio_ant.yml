# =============================================================================
# SIPSA INSUMOS — Parámetros Sin Precio Anterior
# Actualizar cada período: ruta_historico y el flag 'activo' según qué
# módulos corresponden al período (ruta_var_atipico ya no requiere ajuste
# manual, ver nota abajo).
#
# Periodicidades:
#   Agrícolas   — mensual (activo todos los meses)
#   Pecuarios   — mensual (activo todos los meses)
#   Elementos   — bimestral impar (ENE, MAR, MAY, JUL, SEP, NOV)
#   Propagación — bimestral par   (FEB, ABR, JUN, AGO, OCT, DIC)
#
# Este módulo corre DESPUÉS del procesamiento principal de cada uno (agricolas,
# pecuarios, etc.), porque ruta_var_atipico apunta al VAR_ATIPICO_*.xlsx que
# el propio pipeline genera en el paso reporting (data/08_reporting/{periodo}/
# {modulo}/) — no es un archivo externo revisado por un analista.
#
# ruta_historico SÍ es un insumo externo: el Excel "para revisiones" que se
# coloca en data/01_raw/{periodo}/SIN_PRECIO_ANT {periodo}/.
# =============================================================================

sin_precio_ant:

  # ─── Insumos Agrícolas (mensual) ───────────────────────────────────────────
  agricolas:
    ruta_historico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/01_raw/${globals:periodo}/SIN_PRECIO_ANT ${globals:periodo}/Ins_Agrícolas para revisiones.xlsx"
    hoja_historico: "Agrícolas"
    ruta_var_atipico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/08_reporting/${globals:periodo}/agricolas/VAR_ATIPICO_AGRICOLA_${globals:periodo}.xlsx"
    hoja_var_atipico: "VAR_ATIPICO_AGRICOLA"
    casacom_col_hist: "CasaCom."
    unmed_col_hist:   "UnMed."
    modulo:           "AGRICOLAS"
    activo:           true        # siempre activo (mensual)

  # ─── Insumos Pecuarios (mensual) ───────────────────────────────────────────
  pecuarios:
    ruta_historico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/01_raw/${globals:periodo}/SIN_PRECIO_ANT ${globals:periodo}/Ins_Pecuarios para revisiones.xlsx"
    hoja_historico: "Pecuarios"
    ruta_var_atipico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/08_reporting/${globals:periodo}/pecuarios/VAR_ATIPICO_PECUARIO_${globals:periodo}.xlsx"
    hoja_var_atipico: "VAR_ATIPICO_PECUARIO"
    casacom_col_hist: "CasaCom."
    unmed_col_hist:   "UnMed."
    modulo:           "PECUARIOS"
    activo:           true        # siempre activo (mensual)

  # ─── Elementos Agropecuarios (bimestral impar: ENE, MAR, MAY, JUL, SEP, NOV)
  elementos:
    ruta_historico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/01_raw/${globals:periodo}/SIN_PRECIO_ANT ${globals:periodo}/Elementos para revisiones.xlsx"
    hoja_historico: "Elementos"
    ruta_var_atipico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/08_reporting/${globals:periodo}/elementos/VAR_ATIPICO_ELEMENTOS_${globals:periodo}.xlsx"
    hoja_var_atipico: "VAR_ATIPICO_ELEMENTOS"
    casacom_col_hist: "CasaCom."
    unmed_col_hist:   "UnMed."
    modulo:           "ELEMENTOS"
    activo:           true        # JUL es bimestral impar → activo

  # ─── Material de Propagación (bimestral par: FEB, ABR, JUN, AGO, OCT, DIC)
  propagacion:
    ruta_historico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/01_raw/${globals:periodo}/SIN_PRECIO_ANT ${globals:periodo}/Material_propag para revisiones.xlsx"
    hoja_historico: "Material"
    ruta_var_atipico: "C:/Users/Jeferson/Kedro/Sipsa-Insumos/data/08_reporting/${globals:periodo}/propagacion/VAR_ATIPICO_MATERIAL_${globals:periodo}.xlsx"
    hoja_var_atipico: "VAR_ATIPICO_MATERIAL"
    casacom_col_hist: "CasaCom."
    unmed_col_hist:   "UnMed."
    modulo:           "MATERIAL"
    activo:           false       # JUL no es bimestral par → inactivo
